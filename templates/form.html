{% extends 'base.html' %}{% block title %}{{ page_title }} · AnimeVault{% endblock %}{% block content %}<section class="form-heading"><div class="eyebrow">LIBRARY MANAGEMENT</div><h1>{{ page_title }}</h1><p>Save the details that help you keep track of every story.</p></section><form class="anime-form" method="post" enctype="multipart/form-data"><div class="form-grid"><label class="field wide">Anime title <em>*</em><input name="title" maxlength="160" required value="{{ anime.title if anime else '' }}" placeholder="e.g. Demon Slayer"></label><label class="field">Genre<input name="genre" maxlength="120" value="{{ anime.genre if anime else '' }}" placeholder="Action, Fantasy..."></label><label class="field">Viewing status<select name="status">{% for s in statuses %}<option value="{{ s }}" {% if anime and anime.status==s %}selected{% elif not anime and s=='Plan to Watch' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label class="field">Total episodes<input type="number" min="0" step="1" name="total_episodes" value="{{ anime.total_episodes if anime else 0 }}"></label><label class="field">Watched episodes<input type="number" min="0" step="1" name="watched_episodes" value="{{ anime.watched_episodes if anime else 0 }}"></label><label class="field">Rating (0–10)<input type="number" min="0" max="10" step="0.1" name="rating" value="{{ anime.rating if anime and anime.rating is not none else '' }}" placeholder="Optional"></label><label class="field check"><input type="checkbox" name="is_favorite" {% if anime and anime.is_favorite %}checked{% endif %}> ♥ Mark as favourite</label><label class="field wide">Poster image upload <small>PNG, JPG, JPEG, WEBP or GIF · max 5 MB</small><input type="file" name="poster_file" accept=".png,.jpg,.jpeg,.webp,.gif,image/png,image/jpeg,image/webp,image/gif"></label><label class="field wide">Or poster image URL<input type="url" name="poster_url" value="{{ anime.poster_url if anime and anime.poster_url else '' }}" placeholder="https://example.com/poster.jpg"><small>An uploaded file takes priority over the URL.</small></label><label class="field wide">Personal notes<textarea name="notes" rows="4" maxlength="5000" placeholder="Your thoughts, favourite moments, reminders...">{{ anime.notes if anime else '' }}</textarea></label></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('index') }}">Cancel</a><button class="btn primary" type="submit">{{ 'Save changes' if anime else 'Add anime' }}</button></div></form>{% endblock %}
